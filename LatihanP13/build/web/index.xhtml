<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Latihan Login JSF</title>
        <style type="text/css">
            body {
                font-family: "Times New Roman", Times, serif;
                margin: 40px;
                color: #000;
            }
            .container {
                width: 100%;
                max-width: 800px;
                margin: 0 auto;
            }
            .header-text {
                font-size: 1.5em;
                font-weight: bold;
                margin-bottom: 20px;
            }
            .instruction {
                font-size: 1.2em;
                text-align: center;
                margin-bottom: 60px;
            }
            .login-box {
                margin: 0 auto;
                width: fit-content;
                text-align: center;
            }
            .login-title {
                font-weight: bold;
                margin-bottom: 20px;
                font-size: 1.1em;
            }
            .form-table {
                margin: 0 auto;
            }
            .form-table td {
                padding: 5px;
                text-align: left;
            }
            .label-cell {
                width: 120px;
                font-size: 1.1em;
            }
            .input-cell input {
                width: 200px;
                border: 1px solid #ccc;
                padding: 3px;
            }
            .button-cell {
                text-align: left !important;
                padding-top: 10px !important;
            }
            .login-button {
                padding: 2px 10px;
                background-color: #e1e1e1;
                border: 1px solid #999;
                cursor: pointer;
                font-family: inherit;
            }
            .output-section {
                margin-top: 40px;
                font-size: 1.1em;
                line-height: 1.5;
            }
            .bold-text {
                font-weight: bold;
            }
        </style>
    </h:head>
    <h:body>
        <div class="container">
            <h:form>

                <div class="login-box">
                    <div class="login-title">LOGIN</div>
                    <table class="form-table">
                        <tr>
                            <td class="label-cell">User ID</td>
                            <td class="input-cell">
                                <h:inputText id="userId" value="#{loginBean.userId}" />
                            </td>
                        </tr>
                        <tr>
                            <td class="label-cell">Password</td>
                            <td class="input-cell">
                                <h:inputSecret id="password" value="#{loginBean.password}" />
                            </td>
                        </tr>
                        <tr>
                            <td></td>
                            <td class="button-cell">
                                <h:commandButton value="LOGIN" action="#{loginBean.login}" styleClass="login-button" />
                            </td>
                        </tr>
                    </table>
                </div>
            </h:form>

            <h:panelGroup layout="block" class="output-section" rendered="#{loginBean.loggedIn}">
                <div style="margin-bottom: 10px;">Output:</div>
                <div style="margin-bottom: 10px;">Jika sudah mengisi data:</div>
                <div class="bold-text" style="margin-bottom: 5px; text-transform: uppercase;">
                    ANDA SUDAH LOGIN dengan User Id: #{loginBean.userId} dan Password: #{loginBean.password}
                </div>
                <div>
                    Login pada waktu #{loginBean.loginTime} Tanggal #{loginBean.loginDate}
                </div>
            </h:panelGroup>
        </div>
    </h:body>

</html>
