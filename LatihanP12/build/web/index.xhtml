<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Memilih Mata Kuliah</title>
        <style>
            body {
                font-family: serif;
                background-color: white;
                margin: 20px;
            }
            h2 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }
            .form-row {
                margin-bottom: 10px;
            }
            label {
                display: inline-block;
                width: 100px;
            }
        </style>
    </h:head>
    <h:body>
        <h2>Pilih Mata Kuliah</h2>
        <h:form id="courseForm">
            <div class="form-row">
                <h:outputLabel value="Kategori :" for="category" />
                <h:selectOneMenu id="category" value="#{courseBean.selectedCategory}">
                    <f:selectItem itemLabel="" itemValue="" noSelectionOption="true" />
                    <f:selectItems value="#{courseBean.categories}" />
                    <f:ajax listener="#{courseBean.onCategoryChange}" render="course" />
                </h:selectOneMenu>
            </div>
            
            <div class="form-row">
                <h:outputLabel value="Mata Kuliah :" for="course" />
                <h:selectOneMenu id="course" value="#{courseBean.selectedCourse}">
                    <f:selectItem itemLabel="" itemValue="" noSelectionOption="true" />
                    <f:selectItems value="#{courseBean.courses}" />
                </h:selectOneMenu>
            </div>
        </h:form>
    </h:body>
</html>
